<script>
(function () {
  function fitHeroes() {
    document.querySelectorAll(".hero-section").forEach(function (hero) {
      hero.style.width = "";
      hero.style.marginLeft = "0px";
      hero.style.marginRight = "0px";
      var rect = hero.getBoundingClientRect();
      var vw = document.documentElement.clientWidth;
      hero.style.marginLeft = (-rect.left) + "px";
      hero.style.width = vw + "px";
    });
  }
  window.addEventListener("load", function () {
    fitHeroes();
    // catch late reflows (web fonts, iframes) that can shift layout
    // slightly after the load event fires
    setTimeout(fitHeroes, 300);
    setTimeout(fitHeroes, 1200);
  });
  var resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitHeroes, 150);
  });
})();
</script>
